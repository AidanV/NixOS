monitor=,highres,auto,auto

# exec-once=swaybg -i $NIXOS_CONFIG_DIR/pics/wallpaper.png
exec-once=swww init & sww img ./wallpaper.jpg 
exec-once=swaync
# exec-once=foot --server
# exec-once=wlsunset -l -23 -L -46
exec-once=eww daemon
exec-once=eww open bar
# exec-once=dunst

input {
    follow_mouse=0
    touchpad {
      natural_scroll = true
      clickfinger_behavior = true
      tap-to-click = false
      scroll_factor = 0.5
    }
}

gestures {
    workspace_swipe = true
}

misc {
    disable_hyprland_logo = true
}

general {
    sensitivity=1

    gaps_in=6
    gaps_out=12
    border_size=4
    col.active_border=rgba(8ec07c7f)
    col.inactive_border=rgba(2828287f)

}

decoration {
    rounding=8
    drop_shadow=0
    shadow_range=60
    col.shadow=rgba(00000066)
}

animations {
    enabled=1
    animation=windows,1,4,default,slide
    #animation=borders,1,5,default
    #animation=fadein,1,5,default
    #animation=workspaces,1,3,default,vertslide
}

dwindle {
    pseudotile=0 # enable pseudotiling on dwindle
}

# example window rules
# for windows named/classed as abc and xyz
windowrule=float,move 0 0,pqiv
windowrule=float,foot-notes
#windowrule=size 420 69,abc
#windowrule=tile,xyz
#windowrule=float,abc
#windowrule=pseudo,abc
#windowrule=monitor 0,xyz


$mainMod = SUPER
$terminal = kitty
$menu = rofi -show drun
$lock = swaylock --screenshots --effect-blur 10x15 --ring-color 282828 --key-hl-color b8bb26 --line-color 00000000 --inside-color 00000088 --separator-color 00000000 --fade-in 0.05

bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, Q, killactive, 
bind = $mainMod, R, exec, $menu
bind = $mainMode, N, exec, swaync-client -t

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10


# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86Launch1, exec, $lock
bind = , XF86PowerOff, exec, $lock & sleep 2 ; systemctl hibernate
bind = , Print, exec, grimblast copy area

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

bind = $mainMod, f, fullscreen


